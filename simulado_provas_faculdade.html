<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulado - Provas da Faculdade</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        .correct {
            background-color: #d1fae5;
            border-color: #10b981;
        }
        .incorrect {
            background-color: #fee2e2;
            border-color: #ef4444;
        }
        
        button#generate-question-btn {
            background-color: #8b5cf6;
            transition: background-color 0.2s;
            border: 2px solid transparent;
        }
        button#generate-question-btn:hover {
            background-color: #7c3aed;
        }

        @keyframes rainbow-glow {
            0% { box-shadow: 0 0 10px #8b5cf6, 0 0 20px #8b5cf6; }
            20% { box-shadow: 0 0 10px #3b82f6, 0 0 20px #3b82f6; }
            40% { box-shadow: 0 0 10px #22c55e, 0 0 20px #22c55e; }
            60% { box-shadow: 0 0 10px #f59e0b, 0 0 20px #f59e0b; }
            80% { box-shadow: 0 0 10px #ef4444, 0 0 20px #ef4444; }
            100% { box-shadow: 0 0 10px #ec4899, 0 0 20px #ec4899; }
        }
        .animate-rainbow-glow {
            animation: rainbow-glow 3s infinite alternate;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
    <div id="quiz-container" class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-2xl transition-all duration-300">
        <h1 class="text-3xl font-bold text-center mb-6 text-gray-800">Simulado - Provas da Faculdade</h1>
        
        <!-- Container de seleção de semana -->
        <div id="week-selection-container">
             <h2 class="text-2xl font-semibold text-center mb-4 text-gray-700">Selecione o Conteúdo</h2>
             <div id="week-buttons" class="flex flex-col gap-4">
                <!-- Botões da semana serão inseridos aqui -->
             </div>
             <div class="text-center mt-6">
                <p class="text-gray-600 mb-2">Ou carregue seu próprio arquivo:</p>
                <label for="file-upload" class="cursor-pointer bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-4 rounded-xl shadow-md transition-all duration-300 inline-block">
                    Carregar arquivo JSON
                </label>
                <input id="file-upload" type="file" accept=".json" class="hidden">
             </div>
        </div>

        <!-- Container principal do quiz -->
        <div id="quiz-main-content" class="hidden">
            <div id="skip-container" class="text-center mb-4">
                 <button id="skip-to-random-btn" class="text-sm text-indigo-600 hover:text-indigo-800 transition-colors">Pular para Questões Aleatórias ➔</button>
            </div>
            
            <div id="question-card" class="bg-gray-50 p-6 rounded-xl border-2 border-gray-200 transition-all duration-300">
                <div id="status-message" class="text-center text-lg text-gray-700">Carregando questões...</div>
                
                <div id="quiz-content" class="hidden">
                    <p id="question-text" class="text-lg font-semibold mb-4 text-gray-700"></p>
                    <div id="options-container" class="space-y-3"></div>
                    <button id="submit-btn" class="mt-6 w-full py-3 px-4 bg-indigo-600 text-white font-semibold rounded-xl shadow-md hover:bg-indigo-700 transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed">
                        Responder
                    </button>
                </div>

                 <div id="error-message-container" class="hidden text-center mt-4">
                    <p class="text-lg text-red-500 mb-4">Nenhuma pergunta foi encontrada.</p>
                 </div>
            </div>

            <div id="feedback-card" class="hidden mt-6 bg-white p-6 rounded-xl border-2 border-gray-200 shadow-md">
                <div id="feedback-message" class="text-center font-bold text-xl mb-3"></div>
                <div id="justification-text" class="text-gray-600 mb-4"></div>
                <button id="get-details-btn" class="w-full py-3 px-4 bg-green-500 text-white font-semibold rounded-xl shadow-md hover:bg-green-600">
                    Obter explicação detalhada ✨
                </button>
                <div id="llm-explanation" class="mt-4 p-4 bg-gray-100 rounded-lg hidden"></div>
                <button id="next-btn" class="mt-4 w-full py-3 px-4 bg-indigo-500 text-white font-semibold rounded-xl shadow-md hover:bg-indigo-600">
                    Próxima Pergunta
                </button>
            </div>

            <div id="result-card" class="hidden mt-6 bg-white p-8 rounded-2xl shadow-xl">
                <h2 id="result-title" class="text-2xl font-bold text-center mb-4 text-gray-800">Resultado Final</h2>
                <p id="score-text" class="text-center text-lg text-gray-700 mb-6"></p>
                <div id="review-questions" class="space-y-4"></div>
                <button id="generate-question-btn" class="mt-6 w-full py-3 px-4 text-white font-semibold rounded-xl shadow-md">
                    Gerar Pergunta Aleatória ✨
                </button>
                <div id="llm-generated-question" class="hidden mt-4 p-4 bg-gray-100 rounded-lg"></div>
                <button id="restart-btn" class="mt-4 w-full py-3 px-4 bg-indigo-600 text-white font-semibold rounded-xl shadow-md hover:bg-indigo-700">
                    Voltar para Seleção de Semana
                </button>
            </div>
        </div>
    </div>

    <script>
        let fullQuizData = null;
        let quizData = [];
        let quizDataShuffled = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let selectedOption = null;
        let userAnswers = [];

        // Referências aos elementos do DOM
        const quizContainer = document.getElementById('quiz-container');
        const mainQuizTitle = quizContainer.querySelector('h1');
        const weekSelectionContainer = document.getElementById('week-selection-container');
        const weekButtonsContainer = document.getElementById('week-buttons');
        const quizMainContent = document.getElementById('quiz-main-content');
        
        const skipContainer = document.getElementById('skip-container');
        const skipToRandomBtn = document.getElementById('skip-to-random-btn');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const submitBtn = document.getElementById('submit-btn');
        const nextBtn = document.getElementById('next-btn');
        const restartBtn = document.getElementById('restart-btn');
        const feedbackCard = document.getElementById('feedback-card');
        const feedbackMessage = document.getElementById('feedback-message');
        const justificationText = document.getElementById('justification-text');
        const questionCard = document.getElementById('question-card');
        const resultCard = document.getElementById('result-card');
        const resultTitle = document.getElementById('result-title');
        const scoreText = document.getElementById('score-text');
        const reviewQuestions = document.getElementById('review-questions');
        const getDetailsBtn = document.getElementById('get-details-btn');
        const llmExplanationDiv = document.getElementById('llm-explanation');
        const generateQuestionBtn = document.getElementById('generate-question-btn');
        const llmGeneratedQuestionDiv = document.getElementById('llm-generated-question');
        const statusMessage = document.getElementById('status-message');
        const quizContent = document.getElementById('quiz-content');
        const errorMessageContainer = document.getElementById('error-message-container');
        const fileUpload = document.getElementById('file-upload');
        
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function showWeekSelectionScreen() {
            weekSelectionContainer.classList.remove('hidden');
            quizMainContent.classList.add('hidden');
            resultCard.classList.add('hidden');
            mainQuizTitle.textContent = "Simulado - Provas da Faculdade";
            // Recarregar os dados para reexibir os botões
            fetchQuizData();
        }

        function setupWeekSelection(data) {
            if (!data || !data.semanas || !Array.isArray(data.semanas) || data.semanas.length === 0) {
                 showLoadFileMessage("Estrutura do JSON inválida. 'semanas' não encontrado.");
                 return;
            }
            fullQuizData = data;
            weekButtonsContainer.innerHTML = ''; 

            fullQuizData.semanas.forEach((weekData, index) => {
                const button = document.createElement('button');
                button.textContent = weekData.semana;
                button.classList.add('w-full', 'py-3', 'px-4', 'bg-indigo-600', 'text-white', 'font-semibold', 'rounded-xl', 'shadow-md', 'hover:bg-indigo-700', 'transition-all', 'duration-300');
                button.addEventListener('click', () => startQuizForWeek(index));
                weekButtonsContainer.appendChild(button);
            });

            if (fullQuizData.semanas.length > 1) {
                const allWeeksButton = document.createElement('button');
                allWeeksButton.textContent = 'Todas as Semanas';
                allWeeksButton.classList.add('w-full', 'py-3', 'px-4', 'bg-green-600', 'text-white', 'font-semibold', 'rounded-xl', 'shadow-md', 'hover:bg-green-700', 'transition-all', 'duration-300', 'mt-2');
                allWeeksButton.addEventListener('click', startQuizForAllWeeks);
                weekButtonsContainer.appendChild(allWeeksButton);
            }
        }
        
        function showRandomQuestionGenerator() {
            weekSelectionContainer.classList.add('hidden');
            quizMainContent.classList.remove('hidden'); 
            resultCard.classList.remove('hidden');
            
            questionCard.classList.add('hidden');
            feedbackCard.classList.add('hidden');
            skipContainer.classList.add('hidden');

            resultTitle.textContent = "Gerador de Questões";
            scoreText.classList.add('hidden');
            reviewQuestions.classList.add('hidden');
            restartBtn.textContent = "Voltar para Seleção";
        }

        function startQuizForAllWeeks() {
            mainQuizTitle.textContent = `${fullQuizData.materia} - Todas as Semanas`;
            let allQuestions = [];
            fullQuizData.semanas.forEach(week => {
                const weekQuestions = week.perguntas.map(q => ({
                    question: q.questao,
                    options: [...q.alternativas_incorretas, q.resposta_correta],
                    correctAnswerText: q.resposta_correta,
                    justification: q.justificativa,
                    week: week.semana
                }));
                allQuestions.push(...weekQuestions);
            });
            quizData = allQuestions;
            startQuiz();
        }

        function startQuizForWeek(weekIndex) {
            const selectedWeek = fullQuizData.semanas[weekIndex];
            mainQuizTitle.textContent = `${fullQuizData.materia} - ${selectedWeek.semana}`;
            
            quizData = selectedWeek.perguntas.map(q => ({
                question: q.questao,
                options: [...q.alternativas_incorretas, q.resposta_correta],
                correctAnswerText: q.resposta_correta,
                justification: q.justificativa,
                week: selectedWeek.semana
            }));

            startQuiz();
        }

        function startQuiz() {
            weekSelectionContainer.classList.add('hidden');
            quizMainContent.classList.remove('hidden');
            questionCard.classList.remove('hidden');
            resultCard.classList.add('hidden');
            
            quizDataShuffled = [...quizData];
            shuffleArray(quizDataShuffled);
            currentQuestionIndex = 0;
            score = 0;
            userAnswers.length = 0;
            loadQuestion();
        }

        async function fetchQuizData() {
            try {
                const response = await fetch('simulado_data_semanas.json');
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const data = await response.json();
                setupWeekSelection(data);
            } catch (error) {
                console.error("Erro ao carregar o arquivo JSON:", error);
                showLoadFileMessage("Arquivo json contendo as questão não encontrado. Tente carregar um arquivo manualmente.");
            }
        }

        function showLoadFileMessage(message = "Nenhuma pergunta foi encontrada.") {
            weekButtonsContainer.innerHTML = `<p class="text-center text-red-500">${message}</p>`;
            
            const randomQuestionButton = document.createElement('button');
            randomQuestionButton.textContent = 'Ir para o Gerador de Questões ✨';
            randomQuestionButton.classList.add('w-full', 'py-3', 'px-4', 'bg-purple-600', 'text-white', 'font-semibold', 'rounded-xl', 'shadow-md', 'hover:bg-purple-700', 'transition-all', 'duration-300', 'mt-4');
            randomQuestionButton.addEventListener('click', showRandomQuestionGenerator);

            weekButtonsContainer.appendChild(randomQuestionButton);
        }
        
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                     if(data.perguntas && !data.semanas){
                        const flatData = {
                            materia: data.materia || "Simulado Carregado",
                            semanas: [{
                                semana: data.semana || "Questões",
                                perguntas: data.perguntas
                            }]
                        };
                        setupWeekSelection(flatData);
                    } else {
                        setupWeekSelection(data);
                    }
                } catch (error) {
                    console.error("Erro ao processar o arquivo:", error);
                    showLoadFileMessage("Erro ao ler o arquivo. O JSON parece ser inválido.");
                }
            };
            reader.readAsText(file);
        }
        
        function loadQuestion() {
            const currentQuestion = quizDataShuffled[currentQuestionIndex];
            const shuffledOptions = [...currentQuestion.options];
            shuffleArray(shuffledOptions);

            questionText.innerHTML = currentQuestion.question;
            optionsContainer.innerHTML = '';
            
            shuffledOptions.forEach((option) => {
                const button = document.createElement('button');
                button.innerHTML = option;
                button.classList.add('w-full', 'text-left', 'py-3', 'px-4', 'bg-gray-200', 'text-gray-800', 'rounded-lg', 'hover:bg-gray-300', 'transition-all', 'duration-200', 'font-medium');
                button.dataset.option = option;
                button.addEventListener('click', () => {
                    selectedOption = option;
                    document.querySelectorAll('#options-container button').forEach(btn => btn.classList.remove('ring-2', 'ring-indigo-500', 'bg-indigo-100'));
                    button.classList.add('ring-2', 'ring-indigo-500', 'bg-indigo-100');
                    submitBtn.disabled = false;
                });
                optionsContainer.appendChild(button);
            });
            
            statusMessage.classList.add('hidden');
            quizContent.classList.remove('hidden');
            submitBtn.disabled = true;
            selectedOption = null;
            feedbackCard.classList.add('hidden');
            questionCard.classList.remove('incorrect', 'correct');
            resultCard.classList.add('hidden');
            llmExplanationDiv.classList.add('hidden');
        }

        function submitAnswer() {
            if (selectedOption === null) return;
            
            const currentQuestion = quizDataShuffled[currentQuestionIndex];
            const isCorrect = selectedOption === currentQuestion.correctAnswerText;
            userAnswers.push({
                ...currentQuestion,
                userChoice: selectedOption,
                isCorrect: isCorrect
            });

            if (isCorrect) {
                score++;
                feedbackMessage.textContent = '✅ Resposta correta!';
                feedbackMessage.classList.remove('text-red-500');
                feedbackMessage.classList.add('text-green-600');
                questionCard.classList.add('correct');
            } else {
                feedbackMessage.textContent = '❌ Resposta incorreta.';
                feedbackMessage.classList.remove('text-green-600');
                feedbackMessage.classList.add('text-red-500');
                questionCard.classList.add('incorrect');
            }

            justificationText.innerHTML = `<strong>Justificativa:</strong> ${currentQuestion.justification}`;
            feedbackCard.classList.remove('hidden');
            submitBtn.disabled = true;
            
            document.querySelectorAll('#options-container button').forEach(btn => {
                btn.disabled = true;
                if (btn.dataset.option === currentQuestion.correctAnswerText) {
                    btn.classList.add('bg-green-300', 'border-2', 'border-green-600');
                } else if (btn.dataset.option === selectedOption) {
                    btn.classList.add('bg-red-300', 'border-2', 'border-red-600');
                }
            });
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < quizDataShuffled.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            questionCard.classList.add('hidden');
            feedbackCard.classList.add('hidden');
            resultCard.classList.remove('hidden');
            llmGeneratedQuestionDiv.classList.add('hidden');
            
            resultTitle.textContent = "Resultado Final";
            scoreText.classList.remove('hidden');
            reviewQuestions.classList.remove('hidden');
            scoreText.textContent = `Você acertou ${score} de ${quizDataShuffled.length} perguntas.`;
            restartBtn.textContent = "Voltar para Seleção de Semana";


            reviewQuestions.innerHTML = '';
            userAnswers.forEach((answer, index) => {
                const questionReview = document.createElement('div');
                questionReview.classList.add('p-4', 'rounded-lg', 'border', answer.isCorrect ? 'border-green-400' : 'border-red-400', 'bg-gray-50');
                
                questionReview.innerHTML = `
                    <p class="font-semibold text-gray-800 mb-2">
                       <span class="text-xs font-bold text-indigo-600 bg-indigo-100 py-1 px-2 rounded-full mr-2">${answer.week}</span>
                       Pergunta ${index + 1}: ${answer.question}
                    </p>
                    <p class="text-sm ${answer.isCorrect ? 'text-green-700' : 'text-red-700'}">Sua resposta: ${answer.userChoice}</p>
                    ${!answer.isCorrect ? `<p class="text-sm text-green-700">Resposta correta: ${answer.correctAnswerText}</p>` : ''}
                    <p class="text-xs text-gray-500 mt-2"><strong>Justificativa:</strong> ${answer.justification}</p>
                `;
                reviewQuestions.appendChild(questionReview);
            });
        }
        
        async function getLLMResponse(prompt, element) {
            element.textContent = 'Carregando...';
            element.classList.remove('hidden');

            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
            };
            const apiKey = "";
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent?key=${apiKey}`;

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                const result = await response.json();
                const text = result?.candidates?.[0]?.content?.parts?.[0]?.text || 'Não foi possível gerar a resposta.';
                element.innerHTML = text;
            } catch (error) {
                console.error("Erro ao chamar o Gemini API:", error);
                element.textContent = "Erro ao carregar a resposta. Tente novamente.";
            }
        }

        function getDetailedExplanation() {
            const currentQuestion = quizDataShuffled[currentQuestionIndex];
            const prompt = `Explique de forma curta e didática o conceito por trás da seguinte questão de banco de dados:\n\nPergunta: "${currentQuestion.question}"\nResposta Correta: "${currentQuestion.correctAnswerText}".\n\nUse analogias simples e foque em uma explicação clara e concisa, com no máximo 150 palavras.`;
            getLLMResponse(prompt, llmExplanationDiv);
        }

        async function generateRandomQuestion() {
            generateQuestionBtn.classList.remove('animate-rainbow-glow');
            llmGeneratedQuestionDiv.innerHTML = '<p class="text-center">Gerando nova pergunta...</p>';
            llmGeneratedQuestionDiv.classList.remove('hidden');

            const prompt = "Crie uma nova pergunta de múltipla escolha sobre o tema de banco de dados (conceitos básicos como modelo relacional, entidades, chaves, etc.). A pergunta deve ter 4 opções de resposta, com apenas uma correta. Formate a resposta como um objeto JSON com as chaves 'questao', 'alternativas_incorretas' (array de 3 strings) e 'resposta_correta' (string).";

            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                generationConfig: {
                    responseMimeType: "application/json",
                    responseSchema: {
                        type: "OBJECT",
                        properties: {
                            "questao": { "type": "STRING" },
                            "alternativas_incorretas": { "type": "ARRAY", "items": { "type": "STRING" } },
                            "resposta_correta": { "type": "STRING" }
                        },
                        required: ["questao", "alternativas_incorretas", "resposta_correta"]
                    }
                }
            };
            const apiKey = "";
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent?key=${apiKey}`;

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                const result = await response.json();
                const jsonText = result?.candidates?.[0]?.content?.parts?.[0]?.text;
                if (!jsonText) throw new Error("Resposta da API vazia ou inválida.");

                const newQuestion = JSON.parse(jsonText);
                const allOptions = [...newQuestion.alternativas_incorretas, newQuestion.resposta_correta];
                shuffleArray(allOptions);

                llmGeneratedQuestionDiv.innerHTML = `<p class="text-lg font-semibold mb-4 text-gray-700">${newQuestion.questao}</p><div class="space-y-3" id="generated-options-container"></div>`;

                const generatedOptionsContainer = document.getElementById('generated-options-container');
                allOptions.forEach(option => {
                    const button = document.createElement('button');
                    button.innerHTML = option;
                    button.classList.add('w-full', 'text-left', 'py-3', 'px-4', 'bg-gray-200', 'text-gray-800', 'rounded-lg', 'hover:bg-gray-300', 'transition-all', 'duration-200', 'font-medium');
                    button.dataset.option = option;
                    button.addEventListener('click', (e) => {
                        const selectedButton = e.currentTarget;
                        const isCorrect = selectedButton.dataset.option === newQuestion.resposta_correta;
                        
                        generatedOptionsContainer.querySelectorAll('button').forEach(btn => {
                            btn.disabled = true;
                            if (btn.dataset.option === newQuestion.resposta_correta) {
                                btn.classList.remove('bg-gray-200', 'hover:bg-gray-300');
                                btn.classList.add('bg-green-300', 'border-2', 'border-green-600');
                            }
                        });

                        if (!isCorrect) {
                            selectedButton.classList.remove('bg-gray-200', 'hover:bg-gray-300');
                            selectedButton.classList.add('bg-red-300', 'border-2', 'border-red-600');
                        }
                        
                        generateQuestionBtn.classList.add('animate-rainbow-glow');
                    });
                    generatedOptionsContainer.appendChild(button);
                });
            } catch (error) {
                console.error("Erro ao gerar nova pergunta:", error);
                llmGeneratedQuestionDiv.textContent = "Erro ao gerar a pergunta. Tente novamente.";
            }
        }

        // Event Listeners
        submitBtn.addEventListener('click', submitAnswer);
        nextBtn.addEventListener('click', nextQuestion);
        restartBtn.addEventListener('click', showWeekSelectionScreen);
        getDetailsBtn.addEventListener('click', getDetailedExplanation);
        generateQuestionBtn.addEventListener('click', generateRandomQuestion);
        fileUpload.addEventListener('change', handleFileUpload);
        skipToRandomBtn.addEventListener('click', showRandomQuestionGenerator);
        
        // Inicia o simulado
        window.onload = fetchQuizData;
    </script>
</body>
</html>
